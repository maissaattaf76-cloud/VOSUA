
<!DOCTYPE html>
<html lang="ar" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>VOSUA Ω | Obsidian Elite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;400;600;800&family=Orbitron:wght@400;600;900&family=Noto+Sans+Arabic:wght@100;400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
      :root {
        --emerald: #10b981;
        --obsidian: #000000;
        --surface: #0a0c0a;
      }

      body {
        font-family: 'Plus Jakarta Sans', 'Noto Sans Arabic', sans-serif;
        background-color: var(--obsidian);
        color: #ecfdf5;
        overflow: hidden;
        margin: 0;
        height: 100dvh;
        width: 100vw;
        -webkit-font-smoothing: antialiased;
        overscroll-behavior: none;
        position: fixed;
      }

      .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
      .pt-safe { padding-top: env(safe-area-inset-top); }

      .glass-mobile {
        background: rgba(10, 20, 15, 0.75);
        backdrop-filter: blur(20px) saturate(180%);
        -webkit-backdrop-filter: blur(20px) saturate(180%);
        border: 1px solid rgba(16, 185, 129, 0.1);
      }

      .emerald-glow {
        box-shadow: 0 0 20px rgba(16, 185, 129, 0.15);
      }

      .ios-button {
        transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.2s;
        -webkit-tap-highlight-color: transparent;
      }
      .ios-button:active {
        transform: scale(0.95);
        opacity: 0.8;
      }

      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

      @keyframes slide-up {
        from { transform: translateY(100%); }
        to { transform: translateY(0); }
      }
      
      .animate-slide-up {
        animation: slide-up 0.5s cubic-bezier(0.2, 1, 0.2, 1);
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "prismjs/": "https://esm.sh/prismjs@^1.30.0/",
    "prismjs": "https://esm.sh/prismjs@^1.30.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.37.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
  }
}
</script>
</head>
  <body class="pt-safe">
    <div id="root"></div>
  </body>
</html>
