
<!DOCTYPE html>
<html lang="ar">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>VOSUA Ω | Ultimate AI OS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              emerald: {
                500: '#10b981',
                600: '#059669',
              }
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;400;600;800&family=Orbitron:wght@400;600;900&family=Noto+Sans+Arabic:wght@100;400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
      :root {
        --emerald: #10b981;
        --emerald-bright: #34d399;
        --obsidian: #0d1714;
        --glass: rgba(20, 35, 30, 0.75);
        --bg-color: var(--obsidian);
        --text-color: #ffffff;
      }

      html.light {
        --bg-color: #ffffff;
        --text-color: #0a0a0a;
        --glass: rgba(255, 255, 255, 0.85);
      }

      body {
        font-family: 'Plus Jakarta Sans', 'Noto Sans Arabic', sans-serif;
        background: linear-gradient(135deg, #0d1714 0%, #111d1a 50%, #0d1714 100%);
        color: var(--text-color);
        overflow: hidden;
        margin: 0;
        height: 100dvh;
        width: 100vw;
        -webkit-font-smoothing: antialiased;
        position: fixed;
        touch-action: manipulation;
        transition: background 0.3s ease, color 0.3s ease;
      }

      html.light body {
        background: linear-gradient(135deg, #f5f8f7 0%, #ffffff 50%, #f5f8f7 100%);
      }

      /* Optimized Neural Matrix for Mobile */
      .neural-canvas {
        position: fixed;
        inset: 0;
        background: radial-gradient(circle at 50% 0%, rgba(16, 185, 129, 0.18) 0%, transparent 60%);
        z-index: 0;
        pointer-events: none;
      }

      html.light .neural-canvas {
        background: radial-gradient(circle at 50% 0%, rgba(16, 185, 129, 0.1) 0%, transparent 60%);
      }

      .grid-pattern {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(16, 185, 129, 0.08) 1px, transparent 1px),
          linear-gradient(90deg, rgba(16, 185, 129, 0.08) 1px, transparent 1px);
        background-size: 40px 40px;
        mask-image: radial-gradient(ellipse at center, black, transparent 80%);
        transform: perspective(1000px) rotateX(60deg) translateY(-50px);
        opacity: 0.8;
      }

      html.light .grid-pattern {
        opacity: 0.2;
      }

      .glass-premium {
        background: var(--glass);
        backdrop-filter: blur(30px) saturate(180%);
        -webkit-backdrop-filter: blur(30px) saturate(180%);
        border: 1px solid rgba(16, 185, 129, 0.3);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.05);
      }

      html.light .glass-premium {
        border: 1px solid rgba(16, 185, 129, 0.2);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1), inset 0 1px 0 rgba(255, 255, 255, 0.8);
      }

      .font-arabic { font-family: 'Noto Sans Arabic', sans-serif; }
      .font-orbitron { font-family: 'Orbitron', sans-serif; }

      .ios-active:active { transform: scale(0.95); transition: transform 0.1s ease; }
      
      .emerald-glow-strong {
        box-shadow: 0 0 25px rgba(16, 185, 129, 0.3);
      }

      /* Mobile Safe Area Adjustments */
      .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
      .pt-safe { padding-top: env(safe-area-inset-top); }
      
      .no-scrollbar::-webkit-scrollbar { display: none; }
      
      /* Smooth transitions for mobile tab switching */
      .page-transition {
        animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      }
      @keyframes slideUp {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
    </style>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.37.0",
    "prismjs": "https://esm.sh/prismjs@1.29.0",
    "prismjs/components/prism-markup.js": "https://esm.sh/prismjs@1.29.0/components/prism-markup.js",
    "prismjs/components/prism-css.js": "https://esm.sh/prismjs@1.29.0/components/prism-css.js",
    "prismjs/components/prism-javascript.js": "https://esm.sh/prismjs@1.29.0/components/prism-javascript.js",
    "jszip": "https://esm.sh/jszip@3.10.1"
  }
}
</script>
  </head>
  <body>
    <div class="neural-canvas">
      <div class="grid-pattern"></div>
    </div>
    <div id="root"></div>
  </body>
</html>
